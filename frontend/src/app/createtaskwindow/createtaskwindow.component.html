<div class="my-modal-body">
  <div class="my-modal-header">
    <h2>Create your new task here</h2>
    <p>Complete simple form to get started!</p>
    <hr>
  </div>
  <div class="my-modal-fields">
    <div class="input-group">
      <p>Title</p>
      <input type="text" placeholder="Input task title" [(ngModel)]="taskTitle"/>
    </div>
    <div class="input-group">
      <p>Description</p>
      <textarea placeholder="Input task description" [(ngModel)]="taskDescription"></textarea>
    </div>
    <div class="input-group">
      <p>Due to</p>
      <input type="datetime-local" placeholder="MM/DD/YYYY --:--" [(ngModel)]="taskDeadline"/>
    </div>
    <div class="buttons-row">
      <input type="button" class="close-btn" value="Close" (click)="close()"/>
      <input type="button" class="accept-btn" value="Create" (click)="createClick()"/>
    </div>
  </div>
</div>
